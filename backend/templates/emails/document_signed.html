<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Document Signed</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f7fafd; color: #222; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #e3e7ed; padding: 32px; }
        .header { color: #0d1b2a; font-size: 24px; font-weight: bold; margin-bottom: 16px; }
        .lead-info { margin: 24px 0; }
        .btn { display: inline-block; background: #00c6d7; color: #fff; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: bold; }
        .footer { margin-top: 32px; color: #888; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">Document Signed</div>
        <p>Hello,</p>
        <p>The document <strong>{{ document_name }}</strong> for lead <strong>{{ lead_name }}</strong> in <strong>{{ division_name }}</strong> has been signed.</p>
        <div class="lead-info">
            <strong>Document:</strong> {{ document_name }}<br>
            <strong>Lead:</strong> {{ lead_name }}<br>
            <strong>Company:</strong> {{ company_name }}<br>
        </div>
        <a href="{{ action_url }}" class="btn">View Document</a>
        <div class="footer">
            &copy; {{ year }} DealFlow. All rights reserved.
        </div>
    </div>
</body>
</html>
